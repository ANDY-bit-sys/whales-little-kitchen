<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大肥鱼的小饭馆</title>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="theme-color" content="#427f78"><meta name="description" content="和大肥鱼一起经营温暖的二次元小饭馆：选菜单、照顾熟客、赚 Token 升级小店。">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f0eadc;color:#304b41;font-family:system-ui,"Microsoft YaHei",sans-serif}#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#f9f6e9,#e9eadb);z-index:5;padding:24px}.card{position:relative;text-align:center;width:min(570px,100%);padding:44px 48px 36px;background:#fffaf0;border:1px solid #dcd8c5;border-radius:28px}.card:before{content:"";position:absolute;inset:8px;border:1px solid #e9e4d3;border-radius:21px;pointer-events:none}.mark{display:grid;place-items:center;width:100px;height:100px;margin:28px auto 22px;border:1px solid #dce4cc;border-radius:50%;background:#edf2e4;color:#447b68}.mark svg{width:66px;height:66px}.eyebrow{font-size:10px;letter-spacing:3px;color:#527867}h1{font-size:clamp(25px,4vw,34px);letter-spacing:1px;margin:18px 0 14px}p{color:#7e897b;font-size:15px;line-height:1.9;margin:0}progress{appearance:none;border:0;height:6px;width:100%;margin:28px 0 12px;background:#e5e2d4;border-radius:6px;overflow:hidden}progress::-webkit-progress-bar{background:#e5e2d4}progress::-webkit-progress-value{background:#447b68;border-radius:6px}#message{min-height:37px;font-size:12px;color:#7e897b}#start{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;font:inherit;border:1px solid #376b59;background:#447b68;color:#fffaf0;padding:15px 42px;border-radius:13px;cursor:pointer;margin-top:8px;font-weight:700;transition:background .2s}#start:hover:enabled{background:#538975}#start:focus-visible{outline:3px solid #d8b777;outline-offset:4px}#start:disabled{background:#88a697;border-color:#88a697;cursor:wait}.small{font-size:11px;color:#85907c;margin-top:30px;line-height:1.9}.small:before{content:"";display:block;width:48px;height:1px;background:#dfd6be;margin:0 auto 18px}noscript{position:absolute;inset:30%;font-size:20px}@media(max-height:640px){.card{padding:25px 32px 22px}.mark{width:72px;height:72px;margin:14px auto}.mark svg{width:48px;height:48px}h1{margin:10px 0;font-size:25px}progress{margin-top:16px}.small{margin-top:18px}.small:before{margin-bottom:10px}}@media(max-width:420px){#loading{padding:14px}.card{padding-left:24px;padding-right:24px}.eyebrow{font-size:8px;letter-spacing:2px}}
.loading-spinner{display:inline-block;flex:none;width:22px;height:22px;border:3px solid rgba(255,249,234,.32);border-top-color:#fff9ea;border-right-color:#e6c477;border-radius:50%;animation:loading-turn .9s linear infinite}
.card{border-color:#bf965c;background-color:#fffaf0;background-image:radial-gradient(circle at 8px 8px,transparent 4px,#dec6a7 4.5px,#dec6a7 5px,transparent 5.5px);background-size:16px 16px;animation:storybook-open .45s ease-out}.card:before{inset:16px;border-color:#d9bea0;background:#fffaf0;z-index:0}.card>*{position:relative;z-index:1}.card:after{content:"";position:absolute;bottom:5px;right:40px;width:40px;height:22px;background:#c88885;clip-path:polygon(0 0,50% 35%,100% 0,96% 70%,62% 53%,73% 100%,52% 83%,41% 100%,35% 53%,4% 70%)}.mark{width:250px;height:115px;background:none;border:0;border-radius:0;margin:20px auto 14px}.mark img{width:100%;height:100%;object-fit:contain}.eyebrow{color:#a0804f}h1{letter-spacing:2px}.small:before{width:90px;background:#d8b989}#start{outline:1px solid rgba(255,243,207,.6);outline-offset:-5px;transition:transform .18s,background .18s}#start:hover:enabled{transform:translateY(-2px) scale(1.025)}#start:active:enabled{transform:scale(.97)}@keyframes storybook-open{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}@media(max-height:640px){.mark{width:170px;height:80px;margin:12px auto}}@media(prefers-reduced-motion:reduce){.card{animation:none}#start{transition:none}.loading-spinner{animation-duration:2s}}
#loading[data-state="ready"] .loading-spinner,#loading[data-state="failed"] .loading-spinner{display:none}
@keyframes loading-turn{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="大肥鱼的小饭馆，鼠标操作经营游戏"></canvas>
<div id="loading" data-state="loading" aria-busy="true"><main class="card"><div class="eyebrow">WHALE'S LITTLE KITCHEN</div><div class="mark" aria-hidden="true"><img src="cafe-vignette-v1.png" alt=""></div><h1>大肥鱼的小饭馆</h1><p>一家小店，慢慢经营。<br>让每一碗白饭，都带一点温柔。</p><progress id="progress" value="0" max="1" aria-label="小饭馆加载进度"></progress><div id="message" role="status">正在为小店生火……</div><button id="start" disabled><span class="loading-spinner" aria-hidden="true"></span><span id="start-label">正在加载</span></button><div class="small">拖放食材 · 空格暂停<br>你来配料，豆包掌勺，大肥鱼把热饭送到客人桌上。</div></main></div>
<noscript>请启用 JavaScript 后再打开游戏。</noscript>
<script src="index.js"></script>
<script>
const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":428661280,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const params=new URLSearchParams(location.search);
const isChibiPreview=params.has('chibi')||location.pathname.includes('/chibi/');
if(isChibiPreview){document.querySelector('h1').textContent='小饭馆的新伙伴';document.querySelector('.card p').innerHTML='四位新伙伴，准备来小店帮忙啦。<br>转一转，看一看她们的工作动作。';document.querySelector('.small').innerHTML='切换待机、走路和工作动作<br>选择伙伴放大查看 · 拖动旋转视角';}
const flags=['qa','model','staff','back','cafe','chibi'].filter(key=>params.has(key)).map(key=>'--'+key);
if(flags.length)config.args.push('--',...flags);
const engine = new Engine(config);
const start = document.getElementById('start');
const startLabel = document.getElementById('start-label');
const loading = document.getElementById('loading');
const message = document.getElementById('message');
const progress = document.getElementById('progress');
let ready = false;
let started = false;
const missing = Engine.getMissingFeatures({threads:false});
function loadState(state){loading.dataset.state=state;loading.setAttribute('aria-busy',String(state==='loading'));}
function failure(error){console.error(error);loadState('failed');message.textContent='加载未完成，请检查网络后刷新重试。'+String(error.message||error);startLabel.textContent='刷新重试';start.disabled=false;start.onclick=()=>location.reload();}
if(missing.length){loadState('failed');message.textContent='浏览器缺少所需功能：'+missing.join(', ')+'。请尝试新版 Chrome、Edge 或 Firefox。';startLabel.textContent='暂不支持';}
else engine.startGame({onProgress:(current,total)=>{if(total>0){progress.value=current/total;message.textContent=current>=total?'食材已备齐，正在开启餐厅……':'正在布置小饭馆 '+Math.round(current/total*100)+'%';}}}).then(()=>{ready=true;loadState('ready');progress.value=1;message.textContent=isChibiPreview?'新伙伴已经准备好了！':'灶台已经热了，店长请进！';startLabel.textContent=isChibiPreview?'查看新伙伴':'走进小饭馆';start.disabled=false;}).catch(failure);
start.onclick=()=>{if(!ready||started)return;started=true;document.getElementById('loading').remove();document.getElementById('canvas').focus();};
window.addEventListener('keydown',e=>{if(document.activeElement===document.getElementById('canvas')&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
</script>
</body>
</html>
